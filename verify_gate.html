<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 윤리 수사본부 - 보안 자격 검문소</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  
  <!-- PDF.js 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <style>
    :root {
      --bg: #070c18;
      --card-bg: #0f172a;
      --border: #20334e;
      --neon-blue: #00e5ff;
      --neon-gold: #ffd700;
      --neon-green: #10b981;
      --neon-red: #ef4444;
      --text: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(0, 229, 255, 0.12), transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(255, 215, 0, 0.08), transparent 45%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .scanner-card {
      width: 100%;
      max-width: 640px;
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      text-align: center;
      position: relative;
    }

    .gate-badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(0, 229, 255, 0.15);
      border: 1px solid var(--neon-blue);
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--neon-blue);
      margin-bottom: 12px;
    }

    .gate-title {
      font-size: clamp(1.5rem, 3.5vw, 1.9rem);
      font-weight: 900;
      margin-bottom: 8px;
    }

    .gate-desc {
      font-size: 0.95rem;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .drop-zone {
      border: 2.5px dashed #334e75;
      border-radius: 18px;
      padding: 36px 20px;
      background: rgba(11, 19, 36, 0.7);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--neon-blue);
      background: rgba(0, 229, 255, 0.08);
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.25);
    }

    .drop-icon {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    .drop-prompt {
      font-size: 1.05rem;
      font-weight: 800;
      color: #e2e8f0;
      margin-bottom: 6px;
    }

    .drop-sub {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    #fileInput { display: none; }

    .scan-status-panel {
      display: none;
      margin-top: 24px;
      background: #080f1e;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      text-align: left;
    }

    .scan-status-panel.active { display: block; }

    .status-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--neon-blue);
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: #142138;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--neon-blue), var(--neon-gold));
      transition: width 0.3s ease;
    }

    .detect-result-box {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed #1e2e48;
      padding: 6px 0;
    }

    .result-row:last-child { border-bottom: none; }

    .result-val { font-weight: 800; color: #fff; }

    .btn-enter-hq {
      display: none;
      width: 100%;
      padding: 16px 20px;
      background: linear-gradient(90deg, #10b981, #059669);
      border: none;
      border-radius: 14px;
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 900;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.4);
    }
  </style>
</head>
<body>

  <div class="scanner-card">
    <span class="gate-badge">SECURITY GATEWAY : LEVEL 2</span>
    <h1 class="gate-title">활동 2 출동 보안 검문소</h1>
    <p class="gate-desc">
      활동 1에서 발급받은 <strong>[FACT 요원증 PDF 파일]</strong>을 인식시켜 주세요.<br>
      정식 요원 자격이 인증되면 6대 사건 수사본부로 출입이 허가됩니다.
    </p>

    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <div class="drop-icon">📑</div>
      <div class="drop-prompt">요원증 PDF 파일을 여기에 끌어다 놓으세요</div>
      <div class="drop-sub">또는 클릭하여 내 PC의 PDF 파일 선택 (자동 감식 진행)</div>
      <input type="file" id="fileInput" accept="application/pdf">
    </div>

    <div class="scan-status-panel" id="statusPanel">
      <div class="status-title">
        <span id="scanStatusText">📡 문서 보안 코드 정밀 스캔 중...</span>
        <span id="scanPercent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="detect-result-box" id="detectResult"></div>
    </div>

    <button class="btn-enter-hq" id="btnEnter" onclick="goToActivity2()">
      🚨 정식 요원 인증 완료: 활동 2 수사본부 출동 ➔
    </button>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const statusPanel = document.getElementById('statusPanel');
    const progressBar = document.getElementById('progressBar');
    const scanPercent = document.getElementById('scanPercent');
    const scanStatusText = document.getElementById('scanStatusText');
    const detectResult = document.getElementById('detectResult');
    const btnEnter = document.getElementById('btnEnter');

    let verifiedAgentName = "";

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        processPdfFile(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        processPdfFile(e.target.files[0]);
      }
    });

    async function processPdfFile(file) {
      if (!file.name.toLowerCase().endsWith(".pdf")) {
        alert("활동 1에서 발급받은 PDF 파일만 인식할 수 있습니다!");
        return;
      }

      statusPanel.classList.add('active');
      btnEnter.style.display = 'none';
      detectResult.innerHTML = "";
      updateProgress(25, "문서 바이너리 데이터 로드 중...");

      try {
        const arrayBuffer = await file.arrayBuffer();
        const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
        const pdf = await loadingTask.promise;
        
        updateProgress(50, "PDF 텍스트 데이터 추출 중...");
        
        let rawText = "";
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          rawText += content.items.map(item => item.str).join(" ") + " ";
        }

        updateProgress(80, "FACT 요원 공통 시그니처 분석 중...");

        setTimeout(() => {
          verifyCommonSignature(rawText);
        }, 400);

      } catch (err) {
        console.error(err);
        updateProgress(100, "❌ PDF 판독 오류");
        detectResult.innerHTML = `<span style="color:var(--neon-red); font-weight:bold;">PDF 텍스트를 읽을 수 없습니다. 원본 요원증 파일을 넣어주세요.</span>`;
      }
    }

    function updateProgress(pct, text) {
      progressBar.style.width = pct + "%";
      scanPercent.innerText = pct + "%";
      scanStatusText.innerText = text;
    }

    // 공통 불변 데이터 판독 알고리즘
    function verifyCommonSignature(fullText) {
      // 공백 및 특수문자 제거 후 표준 문자열 생성
      const cleanText = fullText.replace(/[\s\r\n\t]/g, '');

      // 1. 공통 키워드 존재 여부 (부분 일치 체크)
      const hasCert = cleanText.includes("AI비판적탐구자요원증") || cleanText.includes("FACT-CHECKER") || cleanText.includes("비판적탐구자");
      const hasMgmtCode = cleanText.includes("2026-AI-6GRADE") || cleanText.includes("수사관리번호");
      const hasCoreLogic = cleanText.includes("3단계작동원리") || cleanText.includes("4대결함") || cleanText.includes("공식FACT요원");
      const hasCaseWord = cleanText.includes("나복사") || cleanText.includes("FACT요원");

      // 핵심 키워드 중 2가지 이상 만족하면 정식 인증서로 판정
      const isValid = (hasCert && (hasMgmtCode || hasCoreLogic)) || (hasMgmtCode && hasCoreLogic);

      if (isValid) {
        updateProgress(100, "✅ FACT 정규 요원 자격 확인 완료!");

        // 학생 이름 추출 로직 (다양한 정규식 패턴 대응)
        let extractedName = "";
        const matchName1 = fullText.match(/수사관\s*성명\s*[:：]?\s*([^\s·•\n]+)/);
        const matchName2 = fullText.match(/수사관\s*:\s*([^\s·•\n]+)\s*수사관/);

        if (matchName1 && matchName1[1]) {
          extractedName = matchName1[1].trim();
        } else if (matchName2 && matchName2[1]) {
          extractedName = matchName2[1].trim();
        } else {
          extractedName = localStorage.getItem("student_name") || "정예 수사관";
        }

        verifiedAgentName = extractedName;

        // localStorage 저장 (활동 2에서 바로 사용)
        localStorage.setItem("student_name", verifiedAgentName);
        localStorage.setItem("fact_certified", "true");

        detectResult.innerHTML = `
          <div class="result-row">
            <span>문서 식별:</span>
            <span class="result-val" style="color:var(--neon-gold);">AI 비판적 탐구자 공식 요원증</span>
          </div>
          <div class="result-row">
            <span>수사관 성명:</span>
            <span class="result-val" style="color:var(--neon-blue);">${verifiedAgentName}</span>
          </div>
          <div class="result-row">
            <span>보안 인가 코드:</span>
            <span class="result-val" style="color:var(--neon-green);">#2026-AI-6GRADE (정식 인가)</span>
          </div>
          <div class="result-row">
            <span>출동 허가 구역:</span>
            <span class="result-val">학교 6대 미스터리 수사본부</span>
          </div>
        `;

        btnEnter.style.display = 'block';

      } else {
        updateProgress(100, "🚨 자격 인증 실패");
        detectResult.innerHTML = `
          <div style="color:var(--neon-red); font-weight:bold; line-height:1.6;">
            [인증 거부] 업로드된 문서는 공인된 'FACT 요원증'이 아닙니다.<br>
            활동 1 시뮬레이터를 통과하고 발급받은 PDF 파일을 넣어주세요.
          </div>
        `;
      }
    }

    function goToActivity2() {
      // 활동 2 메인 허브로 안전하게 이동
      window.location.href = "retro_hub.html";
    }
  </script>
</body>
</html>
